version: "3.9"

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.dashboard=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik-local.yaml:/etc/traefik/dynamic.yml
      - ./certs:/certs

    networks:
      - web

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:latest
    container_name: pocket-id
    restart: unless-stopped

    environment:
      - APP_URL=https://sso.anode.com
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

    volumes:
      - ./.backup/sso:/data

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pocket.rule=Host(`sso.anode.com`)"
      - "traefik.http.routers.pocket.entrypoints=websecure"
      - "traefik.http.routers.pocket.tls=true"
      - "traefik.http.services.pocket.loadbalancer.server.port=1411"

    networks:
      - web

  shared-db:
    image: postgres:16
    container_name: shared-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=anode
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=${ADMIN_DB_PASSWORD}
      - ZABBIX_DB_PASSWORD=${ZABBIX_DB_PASSWORD}
      - FORGEJO_DB_PASSWORD=${FORGEJO_DB_PASSWORD}
    volumes:
      - ./.backup/db:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d
    networks:
      - web

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=shared-db
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
    depends_on:
      - shared-db
    networks:
      - web

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      - DB_SERVER_HOST=shared-db
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=Europe/Paris
    depends_on:
      - zabbix-server
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zabbix.rule=Host(`monitor.anode.com`)"
      - "traefik.http.routers.zabbix.entrypoints=websecure"
      - "traefik.http.routers.zabbix.tls=true"
      - "traefik.http.services.zabbix.loadbalancer.server.port=8080"
    networks:
      - web

  forgejo:
    image: codeberg.org/forgejo/forgejo:10
    container_name: forgejo
    restart: unless-stopped
    environment:
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=shared-db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=${FORGEJO_DB_PASSWORD}
      - FORGEJO__server__DOMAIN=git.anode.com
      - FORGEJO__server__ROOT_URL=https://git.anode.com
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_DOMAIN=git.anode.com
      - FORGEJO__server__SSH_PORT=2222
    volumes:
      - ./.backup/forgejo:/data
    ports:
      - "2222:22"
    depends_on:
      - shared-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`git.anode.com`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
    networks:
      - web

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.backup/portainer:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.anode.com`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls=true"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
    networks:
      - web

  garage:
    build: ./garage
    container_name: garage
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    environment:
      - GARAGE_RPC_SECRET=${GARAGE_RPC_SECRET}
      - GARAGE_BUCKETS=${GARAGE_BUCKETS:-}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ./.backup/s3/meta:/var/lib/garage/meta
      - ./.backup/s3/data:/var/lib/garage/data
      - ./garage/entrypoint.sh:/entrypoint.sh:ro
    labels:
      - "traefik.enable=true"
      # S3 API
      - "traefik.http.routers.garage-s3.rule=Host(`s3.anode.com`)"
      - "traefik.http.routers.garage-s3.entrypoints=websecure"
      - "traefik.http.routers.garage-s3.tls=true"
      - "traefik.http.routers.garage-s3.service=garage-s3"
      - "traefik.http.services.garage-s3.loadbalancer.server.port=3900"
    networks:
      - web

networks:
  web:
    driver: bridge
