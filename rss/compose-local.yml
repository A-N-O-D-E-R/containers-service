services:
  freshrss:
    image: lscr.io/linuxserver/freshrss:latest
    container_name: rss
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${S3_MOUNT_DIR}/config/rss:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`rss.anode.com`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
    restart: unless-stopped
    networks:
      - anode-shared-network

networks:
  anode-shared-network:
    external: true

