services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - JELLYFIN_PublishedServerUrl=https://tv.anode.com
    volumes:
      - ${S3_DATA_DIR}/config/jellyfin:/config
      - ${S3_DATA_DIR}/tvseries:/data/tvshows
      - ${S3_DATA_DIR}/movies:/data/movies
    labels:
      - "sablier.enable=true"
      - "sablier.group=jellyfin"
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-sablier"
      - "traefik.http.middlewares.jellyfin-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.jellyfin-sablier.plugin.sablier.group=jellyfin"
      - "traefik.http.middlewares.jellyfin-sablier.plugin.sablier.sessionDuration=30m"
      - "traefik.http.middlewares.jellyfin-sablier.plugin.sablier.blocking.timeout=5m"
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`tv.anode.com`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    restart: unless-stopped
    networks:
      - anode-shared-network

networks:
  anode-shared-network:
    external: true