---
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ${S3_MOUNT_DIR}/config/lidarr:/config
      - ${S3_MOUNT_DIR}/music:/music #optional
      - ${S3_MOUNT_DIR}/downloads:/downloads #optional
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.anode.com`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls=true"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
    restart: unless-stopped
    networks:
      - anode-shared-network


networks:
  anode-shared-network:
    external: true