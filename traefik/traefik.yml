# Static configuration, shared by local and prod.
# TLS uses the mkcert wildcard from dynamic.yml (anode.com is private: no ACME).
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

providers:
  docker:
    exposedByDefault: false
    network: anode-shared-network
  file:
    filename: /etc/traefik/dynamic.yml
    watch: false  # restart traefik after editing dynamic.yml

api:
  dashboard: true

log:
  level: INFO

# On-demand start of idle containers (needs Traefik >= 3.6 for
# traefik.docker.allownonrunning on stopped containers).
experimental:
  plugins:
    sablier:
      moduleName: github.com/sablierapp/sablier-traefik-plugin
      version: v1.4.0
