## Common flags:
# demo-users
# email-verification
# log-emails
# log-invitation-tokens
# login-with-github
# login-with-gitlab
# login-with-google
# login-with-ldap
# login-with-oidc
# login-with-password
# prepl-server
# registration
# secure-session-cookies
# smtp
# smtp-debug
# telemetry
# webhooks
##
## You can read more about all available flags and other
## environment variables here:
## https://help.penpot.app/technical-guide/configuration/#advanced-configuration
#
# WARNING: if you're exposing Penpot to the internet, you should remove the flags
# 'disable-secure-session-cookies' and 'disable-email-verification'
x-flags: &penpot-flags
  PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies

x-uri: &penpot-public-uri
  PENPOT_PUBLIC_URI: https://penpot.anode.com

x-body-size: &penpot-http-body-size
  PENPOT_HTTP_SERVER_MAX_BODY_SIZE: 31457280
  PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: 367001600

volumes:
  penpot_assets:

services:
  penpot-frontend:
    image: "penpotapp/frontend:${PENPOT_VERSION:-latest}"
    restart: unless-stopped
    volumes:
      - penpot_assets:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - anode-shared-network
    labels:
      - "sablier.enable=true"
      - "sablier.group=penpot"
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.routers.penpot-https.middlewares=penpot-sablier"
      - "traefik.http.middlewares.penpot-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.penpot-sablier.plugin.sablier.group=penpot"
      - "traefik.http.middlewares.penpot-sablier.plugin.sablier.sessionDuration=30m"
      - "traefik.http.middlewares.penpot-sablier.plugin.sablier.dynamic.displayName=Penpot"
      - "traefik.enable=true"
      - "traefik.http.routers.penpot-https.rule=Host(`penpot.anode.com`)"
      - "traefik.http.routers.penpot-https.entrypoints=websecure"
      - "traefik.http.routers.penpot-https.tls=true"
      - "traefik.http.services.penpot.loadbalancer.server.port=8080"
    environment:
      << : [*penpot-flags, *penpot-http-body-size]

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION:-latest}"
    restart: unless-stopped
    volumes:
      - penpot_assets:/opt/data/assets
    networks:
      - anode-shared-network
    environment:
      << : [*penpot-flags, *penpot-public-uri, *penpot-http-body-size]
      PENPOT_DATABASE_URI: postgresql://shared-db/${PENPOT_DB_NAME}
      PENPOT_DATABASE_USERNAME: ${PENPOT_DB_USER}
      PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD}
      PENPOT_REDIS_URI: redis://shared-cache/0
      PENPOT_STORAGE_ASSETS_S3_ENDPOINT: http://penpot-minio:9000
      PENPOT_STORAGE_ASSETS_S3_BUCKET: penpot-asset
      AWS_ACCESS_KEY_ID: <KEY_ID>
      AWS_SECRET_ACCESS_KEY: <ACCESS_KEY>
      PENPOT_TELEMETRY_ENABLED: true
      PENPOT_TELEMETRY_REFERER: compose
      PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
      PENPOT_SMTP_HOST: mail
      PENPOT_SMTP_PORT: 1025
      PENPOT_SMTP_USERNAME:
      PENPOT_SMTP_PASSWORD:
      PENPOT_SMTP_TLS: false
      PENPOT_SMTP_SSL: false
    labels:
      - "sablier.enable=true"
      - "sablier.group=penpot"

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION:-latest}"
    restart: unless-stopped
    networks:
      - anode-shared-network
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://shared-cache/0
    labels:
      - "sablier.enable=true"
      - "sablier.group=penpot"


networks:
  anode-shared-network:
    external: true

