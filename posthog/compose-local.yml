# PostHog hobby deployment (local)
# Uses its own internal postgres, clickhouse, kafka stack — not compatible with shared-db.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  posthog-db:
    image: postgres:15-alpine
    container_name: posthog_db
    restart: unless-stopped
    logging: *default-logging
    environment:
      - POSTGRES_USER=posthog
      - POSTGRES_PASSWORD=posthog
      - POSTGRES_DB=posthog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posthog"]
      interval: 5s
      timeout: 30s
      retries: 30
    volumes:
      - posthog-postgres:/var/lib/postgresql/data
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

  posthog-redis:
    image: redis:7.2-alpine
    container_name: posthog_redis
    restart: unless-stopped
    logging: *default-logging
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - posthog-redis:/data
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

  posthog-clickhouse:
    image: clickhouse/clickhouse-server:26.6.1.1193
    container_name: posthog_clickhouse
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - posthog-clickhouse:/var/lib/clickhouse
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

  posthog-zookeeper:
    image: zookeeper:3.7.0
    container_name: posthog_zookeeper
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ZOO_AUTOPURGE_PURGEINTERVAL=1
      - ZOO_AUTOPURGE_SNAPRETAINCOUNT=3
    volumes:
      - posthog-zookeeper-data:/data
      - posthog-zookeeper-datalog:/datalog
      - posthog-zookeeper-logs:/logs
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

  posthog-kafka:
    image: docker.io/redpandadata/redpanda:v25.1.9
    container_name: posthog_kafka
    restart: unless-stopped
    logging: *default-logging
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://posthog-kafka:9092,external://localhost:19092
      - --mode dev-container
      - --smp 2
      - --memory 3G
      - --reserve-memory 500M
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds posthog-kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    healthcheck:
      test: curl -f http://localhost:9644/v1/status/ready || exit 1
      interval: 3s
      timeout: 10s
      retries: 10
    volumes:
      - posthog-kafka:/bitnami/kafka
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

  posthog-objectstorage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: posthog_objectstorage
    restart: unless-stopped
    logging: *default-logging
    environment:
      - MINIO_ROOT_USER=object_storage_root_user
      - MINIO_ROOT_PASSWORD=${POSTHOG_OBJECT_STORAGE_PASSWORD}
    entrypoint: sh
    command: -c 'mkdir -p /data/posthog && minio server --address ":19000" --console-address ":19001" /data'
    volumes:
      - posthog-objectstorage:/data
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

  posthog-web:
    image: posthog/posthog:latest
    container_name: posthog_web
    restart: unless-stopped
    logging: *default-logging
    command: ./bin/start-backend & ./bin/start-frontend
    environment:
      - SITE_URL=https://posthog.anode.com
      - SECRET_KEY=${POSTHOG_SECRET_KEY}
      - ENCRYPTION_SALT_KEYS=${POSTHOG_ENCRYPTION_SALT_KEYS}
      - DATABASE_URL=postgres://posthog:posthog@posthog-db:5432/posthog
      - REDIS_URL=redis://posthog-redis:6379/
      - CLICKHOUSE_HOST=posthog-clickhouse
      - KAFKA_HOSTS=posthog-kafka:9092
      - OBJECT_STORAGE_ENABLED=true
      - OBJECT_STORAGE_ENDPOINT=http://posthog-objectstorage:19000
      - OBJECT_STORAGE_ACCESS_KEY_ID=object_storage_root_user
      - OBJECT_STORAGE_SECRET_ACCESS_KEY=${POSTHOG_OBJECT_STORAGE_PASSWORD}
      - OBJECT_STORAGE_BUCKET=posthog
      - DEPLOYMENT=hobby
      - DISABLE_SECURE_SSL_REDIRECT=1
      - IS_BEHIND_PROXY=1
      - TRUST_ALL_PROXIES=1
    depends_on:
      posthog-db:
        condition: service_healthy
      posthog-redis:
        condition: service_healthy
      posthog-clickhouse:
        condition: service_healthy
      posthog-kafka:
        condition: service_healthy
      posthog-objectstorage:
        condition: service_started
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"
      - "traefik.docker.allownonrunning=true"
      - "traefik.http.routers.posthog.middlewares=posthog-sablier"
      - "traefik.http.middlewares.posthog-sablier.plugin.sablier.sablierUrl=http://sablier:10000"
      - "traefik.http.middlewares.posthog-sablier.plugin.sablier.group=posthog"
      - "traefik.http.middlewares.posthog-sablier.plugin.sablier.sessionDuration=30m"
      - "traefik.http.middlewares.posthog-sablier.plugin.sablier.blocking.timeout=5m"
      - "traefik.enable=true"
      - "traefik.http.routers.posthog.rule=Host(`posthog.anode.com`)"
      - "traefik.http.routers.posthog.entrypoints=websecure"
      - "traefik.http.services.posthog.loadbalancer.server.port=8000"
    networks:
      - posthog
      - anode-shared-network

  posthog-worker:
    image: posthog/posthog:latest
    container_name: posthog_worker
    restart: unless-stopped
    logging: *default-logging
    command: ./bin/docker-worker-celery --with-scheduler
    environment:
      - SITE_URL=https://posthog.anode.com
      - SECRET_KEY=${POSTHOG_SECRET_KEY}
      - ENCRYPTION_SALT_KEYS=${POSTHOG_ENCRYPTION_SALT_KEYS}
      - DATABASE_URL=postgres://posthog:posthog@posthog-db:5432/posthog
      - REDIS_URL=redis://posthog-redis:6379/
      - CLICKHOUSE_HOST=posthog-clickhouse
      - KAFKA_HOSTS=posthog-kafka:9092
      - OBJECT_STORAGE_ENABLED=true
      - OBJECT_STORAGE_ENDPOINT=http://posthog-objectstorage:19000
      - OBJECT_STORAGE_ACCESS_KEY_ID=object_storage_root_user
      - OBJECT_STORAGE_SECRET_ACCESS_KEY=${POSTHOG_OBJECT_STORAGE_PASSWORD}
      - OBJECT_STORAGE_BUCKET=posthog
      - DEPLOYMENT=hobby
    depends_on:
      - posthog-web
    networks:
      - posthog
    labels:
      - "sablier.enable=true"
      - "sablier.group=posthog"

volumes:
  posthog-postgres:
  posthog-redis:
  posthog-clickhouse:
  posthog-kafka:
  posthog-objectstorage:
  posthog-zookeeper-data:
  posthog-zookeeper-datalog:
  posthog-zookeeper-logs:

networks:
  posthog:
  anode-shared-network:
    external: true
