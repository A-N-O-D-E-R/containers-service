services:
  logseq:
    build: .
    container_name: logseq
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.logseq.rule=Host(`note.anode.com`)"
      - "traefik.http.routers.logseq.entrypoints=websecure"
      - "traefik.http.routers.logseq.tls=true"
      - "traefik.http.services.logseq.loadbalancer.server.port=80"
    networks:
      - anode-shared-network

networks:
  anode-shared-network:
    external: true
