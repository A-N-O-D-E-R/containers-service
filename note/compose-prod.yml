services:
  note:
    image: b3log/siyuan
    container_name: note
    command: ['--workspace=/anode/workspace/', '--accessAuthCode=${NoteAuthCode}']
    volumes:
      - ${S3_MOUNT_DIR}/note:/anode/workspace
    restart: unless-stopped
    environment:
      # A list of time zone identifiers can be found at https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      - TZ=${TZ:-Etc/UTC}
      - PUID=${PUID:-1000}  # Customize user ID
      - PGID=${PGID:-1000}  # Customize group ID
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.note.rule=Host(`note.anode.com`)"
      - "traefik.http.routers.note.entrypoints=websecure"
      - "traefik.http.routers.note.tls=true"
      - "traefik.http.routers.note.tls.certresolver=letsencrypt"
      - "traefik.http.services.note.loadbalancer.server.port=6806"
    networks:
      - anode-shared-network

networks:
  anode-shared-network:
    external: true
