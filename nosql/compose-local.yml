services:
  shared-nosql:
    image: mongo:8
    container_name: shared-nosql
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${ADMIN_NOSQL_PASSWORD}
      - MONGO_INITDB_DATABASE=admin
      - CREDENTIALS=${NOSQL_CREDENTIALS}
    volumes:
      - ${BACKUP_DIR}/nosql:/data/db
      - ./initdb:/docker-entrypoint-initdb.d
    
    networks:
      - anode-shared-network

networks:
  anode-shared-network:
    external: true
